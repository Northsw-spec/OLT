name: CHES private-local import geometry audit (no copyrighted text artifacts)
on:
  pull_request:
    paths:
      - "scripts/ches_pdf_probe.py"
      - "scripts/ches_import.py"
      - "scripts/ches_index.py"
      - "scripts/ches_private_batch.py"
      - "scripts/ches_oshb_verse_qa.py"
      - "olt_core/english_drafts.py"
      - "tests/test_ches_002_source_first.py"
      - "scripts/ches_private_alignment_review.py"
      - "tests/test_ches_003_private_review.py"
      - "scripts/ches_lite_english.py"
      - "tests/test_ches_004_lite_pipeline.py"
      - "scripts/ches_005_safe_exceptions.py"
      - "tests/test_ches_005_safe_exceptions.py"
      - "scripts/ches_005_chapter_layout_qa.py"
      - "tests/test_ches_005_chapter_layout.py"
      - "scripts/ches_006_layout_metrics.py"
      - "tests/test_ches_006_layout_metrics.py"
      - "scripts/ches_006_pilot_summary.py"
      - "tests/test_ches_006_pilot_summary.py"
      - "scripts/ches_007_multichapter_english.py"
      - "tests/test_ches_007_multichapter_english.py"
      - "scripts/ches_008_private_batch.py"
      - "tests/test_ches_008_private_batch.py"
      - "scripts/ches_009_source_discovery.py"
      - "tests/test_ches_009_source_discovery.py"
      - "tests/test_ches_009_six_source_batch.py"
      - "data/engine/olt_ches_source_manifest.json"
      - "tests/test_ches_import.py"
      - ".github/workflows/ches-ingest.yml"
      - "docs/OLT_CHES_PRIVATE_INGEST.md"
  push:
    branches: [main]
    paths:
      - "scripts/ches_pdf_probe.py"
      - "scripts/ches_import.py"
      - "scripts/ches_index.py"
      - "scripts/ches_private_batch.py"
      - "scripts/ches_oshb_verse_qa.py"
      - "olt_core/english_drafts.py"
      - "tests/test_ches_002_source_first.py"
      - "scripts/ches_private_alignment_review.py"
      - "tests/test_ches_003_private_review.py"
      - "scripts/ches_lite_english.py"
      - "tests/test_ches_004_lite_pipeline.py"
      - "scripts/ches_005_safe_exceptions.py"
      - "tests/test_ches_005_safe_exceptions.py"
      - "scripts/ches_005_chapter_layout_qa.py"
      - "tests/test_ches_005_chapter_layout.py"
      - "scripts/ches_006_layout_metrics.py"
      - "tests/test_ches_006_layout_metrics.py"
      - "scripts/ches_006_pilot_summary.py"
      - "tests/test_ches_006_pilot_summary.py"
      - "scripts/ches_007_multichapter_english.py"
      - "tests/test_ches_007_multichapter_english.py"
      - "scripts/ches_008_private_batch.py"
      - "tests/test_ches_008_private_batch.py"
      - "scripts/ches_009_source_discovery.py"
      - "tests/test_ches_009_source_discovery.py"
      - "tests/test_ches_009_six_source_batch.py"
      - "data/engine/olt_ches_source_manifest.json"
      - "tests/test_ches_import.py"
      - ".github/workflows/ches-ingest.yml"
      - "docs/OLT_CHES_PRIVATE_INGEST.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-ches-import-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned PDF text positioning dependency
        run: python -m pip install PyMuPDF==1.26.5
      - name: Verify all 39 source book-index prefixes and exact chapter-link count without text copying
        run: |
          curl --fail --location --retry 3 --max-time 45 --silent --show-error \
            https://www.scripture4all.org/OnlineInterlinear/Hebrew_Index.htm \
            --output "$RUNNER_TEMP/ches-hebrew-index.html"
          python scripts/ches_index.py --index "$RUNNER_TEMP/ches-hebrew-index.html" \
            --require-ot-chapters 929 --require-books 39
      - name: Obtain single original Genesis 1 PDF only to ephemeral runner storage
        run: |
          curl --fail --location --retry 3 --max-time 65 --silent --show-error \
            https://www.scripture4all.org/OnlineInterlinear/OTpdf/gen1.pdf \
            --output "$RUNNER_TEMP/ches-gen1.pdf"
          test "$(wc -c < "$RUNNER_TEMP/ches-gen1.pdf")" -gt 5000
      - name: Inspect source PDF colors geometry and verse references without emitting source text
        run: python scripts/ches_pdf_probe.py --pdf "$RUNNER_TEMP/ches-gen1.pdf"
      - name: Test private-safe importer contracts and actual hash-pinned Genesis PDF
        env:
          CHES_TEST_PDF: ${{ runner.temp }}/ches-gen1.pdf
        run: python -m unittest discover -s tests -p 'test_ches_import.py' -v
      - name: Verify 1-chapter extraction in memory; no copyrighted payload or stored artifacts
        run: python scripts/ches_import.py --pdf "$RUNNER_TEMP/ches-gen1.pdf" --book Gen --chapter 1 --audit
      - name: Verify real private PDF Genesis verse markers versus hash-pinned Hebrew source
        run: python -m scripts.ches_oshb_verse_qa --pdf "$RUNNER_TEMP/ches-gen1.pdf"
      - name: Check deterministic 31-verse English research draft against original source tokens
        run: python -m unittest discover -s tests -p 'test_ches_002_source_first.py' -v
      - name: Check synthetic private manual word-review queue safety and source identities
        run: python -m unittest discover -s tests -p 'test_ches_003_private_review.py' -v
      - name: Audit real Genesis PDF privately without writing or logging CHES text
        run: |
          python -m scripts.ches_private_alignment_review \
            --pdf "$RUNNER_TEMP/ches-gen1.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: Verify lightweight actual-English-source pipeline using invented green glosses and pinned Hebrew
        run: python -m unittest discover -s tests -p 'test_ches_004_lite_pipeline.py' -v
      - name: Audit real Genesis CHES English interlinear draft in memory (metadata only)
        run: |
          python -m scripts.ches_lite_english \
            --pdf "$RUNNER_TEMP/ches-gen1.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: Verify CHES-005 private exact source-token and PDF-span English exception rules
        run: python -m unittest discover -s tests -p 'test_ches_005_safe_exceptions.py' -v
      - name: Verify CHES-005 synthetic second-chapter verse-layout contracts
        run: python -m unittest discover -s tests -p 'test_ches_005_chapter_layout.py' -v
      - name: Audit CHES-005 true Genesis PDF against pinned original Hebrew (metadata only)
        run: |
          python -m scripts.ches_005_safe_exceptions \
            --pdf "$RUNNER_TEMP/ches-gen1.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: Fetch second authentic source chapter into ephemeral runner storage
        run: |
          curl --fail --location --retry 3 --max-time 65 --silent --show-error \
            https://www.scripture4all.org/OnlineInterlinear/OTpdf/gen2.pdf \
            --output "$RUNNER_TEMP/ches-gen2.pdf"
          test "$(wc -c < "$RUNNER_TEMP/ches-gen2.pdf")" -gt 5000
      - name: Audit actual second chapter PDF layout against 25 authentic original Hebrew verses
        run: |
          python -m scripts.ches_005_chapter_layout_qa \
            --pdf "$RUNNER_TEMP/ches-gen2.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-006 synthetic geometry/source contracts and negative boundary tests
        run: python -m unittest discover -s tests -p 'test_ches_006_layout_metrics.py' -v
      - name: CHES-006 source-pinned Genesis 1 metadata-only layout diagnostics
        run: |
          python -m scripts.ches_006_layout_metrics \
            --book Gen --chapter 1 --pdf "$RUNNER_TEMP/ches-gen1.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-006 source-pinned Genesis 2 metadata-only layout diagnostics
        run: |
          python -m scripts.ches_006_layout_metrics \
            --book Gen --chapter 2 --pdf "$RUNNER_TEMP/ches-gen2.pdf" \
            --confirm-machine-readable-use-permission
      - name: Fetch extra authentic original source PDFs only to ephemeral runner storage
        run: |
          curl --fail --location --retry 3 --max-time 65 --silent --show-error \
            https://www.scripture4all.org/OnlineInterlinear/OTpdf/gen3.pdf \
            --output "$RUNNER_TEMP/ches-gen3.pdf"
          curl --fail --location --retry 3 --max-time 65 --silent --show-error \
            https://www.scripture4all.org/OnlineInterlinear/OTpdf/exo1.pdf \
            --output "$RUNNER_TEMP/ches-ex1.pdf"
          wc -c "$RUNNER_TEMP/ches-gen3.pdf" "$RUNNER_TEMP/ches-ex1.pdf"
          file --mime-type "$RUNNER_TEMP/ches-gen3.pdf" "$RUNNER_TEMP/ches-ex1.pdf"
          python - <<'PY'
          from pathlib import Path
          import os
          for filename in ("ches-gen3.pdf", "ches-ex1.pdf"):
              path = Path(os.environ["RUNNER_TEMP"]) / filename
              if not path.is_file() or not 1000 <= path.stat().st_size <= 30000000:
                  raise ValueError("Original source file missing or invalid size")
              with path.open("rb") as file:
                  if file.read(5) != b"%PDF-":
                      raise ValueError("Original source is not a PDF")
          PY
      - name: CHES-006 exact source-pinned Genesis 3 PDF layout audit (metadata only)
        run: |
          python -m scripts.ches_006_layout_metrics \
            --book Gen --chapter 3 --pdf "$RUNNER_TEMP/ches-gen3.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-006 exact source-pinned Exodus 1 PDF layout audit (metadata only)
        run: |
          python -m scripts.ches_006_layout_metrics \
            --book Exod --chapter 1 --pdf "$RUNNER_TEMP/ches-ex1.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-006 synthetic aggregate safety contract and negative tests
        run: python -m unittest discover -s tests -p 'test_ches_006_pilot_summary.py' -v
      - name: CHES-006 compare four SHA-pinned real original PDFs and OSHB without copyrighted text
        run: |
          python -m scripts.ches_006_pilot_summary \
            --pdf-directory "$RUNNER_TEMP" \
            --confirm-machine-readable-use-permission
      - name: CHES-007 check genuine OSHB words and private English drafts using invented glosses
        run: python -m unittest discover -s tests -p 'test_ches_007_multichapter_english.py' -v
      - name: CHES-007 build real Genesis 2 private English gloss stream in memory
        run: |
          python -m scripts.ches_007_multichapter_english \
            --book Gen --chapter 2 --pdf "$RUNNER_TEMP/ches-gen2.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: CHES-007 build real Genesis 3 private English gloss stream in memory
        run: |
          python -m scripts.ches_007_multichapter_english \
            --book Gen --chapter 3 --pdf "$RUNNER_TEMP/ches-gen3.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: CHES-007 build real Exodus 1 private English gloss stream in memory
        run: |
          python -m scripts.ches_007_multichapter_english \
            --book Exod --chapter 1 --pdf "$RUNNER_TEMP/ches-ex1.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: CHES-008 synthetic batch resume, retry, orphan and source-integrity regression tests
        run: python -m unittest discover -s tests -p 'test_ches_008_private_batch.py' -v
      - name: CHES-008 actual original PDF English batch, intentionally stop after two chapters
        run: |
          python -m scripts.ches_008_private_batch \
            --pdf-directory "$RUNNER_TEMP" \
            --output-private-directory "$RUNNER_TEMP/.olt-private/ches-008" \
            --confirm-machine-readable-use-permission --limit 2
      - name: CHES-008 resume real four-chapter English draft batch from private checkpoint
        run: |
          python -m scripts.ches_008_private_batch \
            --pdf-directory "$RUNNER_TEMP" \
            --output-private-directory "$RUNNER_TEMP/.olt-private/ches-008" \
            --confirm-machine-readable-use-permission
      - name: CHES-008 verify no source text is printed and finished chapters are skipped
        run: |
          python -m scripts.ches_008_private_batch \
            --pdf-directory "$RUNNER_TEMP" \
            --output-private-directory "$RUNNER_TEMP/.olt-private/ches-008" \
            --confirm-machine-readable-use-permission
      - name: CHES-009 original-language verse inventory and malformed source negative tests
        run: python -m unittest discover -s tests -p 'test_ches_009_source_discovery.py' -v
      - name: CHES-009 check two new PDF links exist in authoritative original chapter index
        run: |
          grep -Fq 'OTpdf/gen4.pdf' "$RUNNER_TEMP/ches-hebrew-index.html"
          grep -Fq 'OTpdf/exo2.pdf' "$RUNNER_TEMP/ches-hebrew-index.html"
      - name: CHES-009 fetch two authentic original chapter PDF candidates (ephemeral only)
        run: |
          curl --fail --location --retry 3 --max-time 65 --silent --show-error \
            https://www.scripture4all.org/OnlineInterlinear/OTpdf/gen4.pdf \
            --output "$RUNNER_TEMP/ches-gen4.pdf"
          curl --fail --location --retry 3 --max-time 65 --silent --show-error \
            https://www.scripture4all.org/OnlineInterlinear/OTpdf/exo2.pdf \
            --output "$RUNNER_TEMP/ches-ex2.pdf"
          python - <<'PY'
          from pathlib import Path
          import os
          for basename in ("ches-gen4.pdf", "ches-ex2.pdf"):
              f = Path(os.environ["RUNNER_TEMP"]) / basename
              if not f.is_file() or not 1000 <= f.stat().st_size <= 30_000_000:
                  raise ValueError("Invalid original source PDF size")
              with f.open("rb") as s:
                  if s.read(5) != b"%PDF-":
                      raise ValueError("Original chapter candidate is not PDF data")
          PY
      - name: CHES-009 metadata-only original Genesis 4 PDF source discovery
        run: |
          python -m scripts.ches_009_source_discovery \
            --book Gen --chapter 4 --pdf "$RUNNER_TEMP/ches-gen4.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-009 metadata-only original Exodus 2 PDF source discovery
        run: |
          python -m scripts.ches_009_source_discovery \
            --book Exod --chapter 2 --pdf "$RUNNER_TEMP/ches-ex2.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-009 synthetically verify backward-compatible private four-to-six chapter restart
        run: python -m unittest discover -s tests -p 'test_ches_009_six_source_batch.py' -v
      - name: CHES-009 audit pinned real Genesis 4 layout and genuine OSHB original words
        run: |
          python -m scripts.ches_006_layout_metrics \
            --book Gen --chapter 4 --pdf "$RUNNER_TEMP/ches-gen4.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-009 audit pinned real Exodus 2 layout and genuine OSHB original words
        run: |
          python -m scripts.ches_006_layout_metrics \
            --book Exod --chapter 2 --pdf "$RUNNER_TEMP/ches-ex2.pdf" \
            --confirm-machine-readable-use-permission
      - name: CHES-009 build real private Genesis 4 English working verse glosses in memory
        run: |
          python -m scripts.ches_007_multichapter_english \
            --book Gen --chapter 4 --pdf "$RUNNER_TEMP/ches-gen4.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: CHES-009 build real private Exodus 2 English working verse glosses in memory
        run: |
          python -m scripts.ches_007_multichapter_english \
            --book Exod --chapter 2 --pdf "$RUNNER_TEMP/ches-ex2.pdf" \
            --confirm-machine-readable-use-permission --audit
      - name: CHES-009 resume existing four-source state and add two pinned private chapters
        run: |
          python -m scripts.ches_008_private_batch \
            --pdf-directory "$RUNNER_TEMP" \
            --output-private-directory "$RUNNER_TEMP/.olt-private/ches-008" \
            --confirm-machine-readable-use-permission --extended --limit 6
      - name: CHES-009 verify all six unchanged original-source draft chapters are skipped
        run: |
          python -m scripts.ches_008_private_batch \
            --pdf-directory "$RUNNER_TEMP" \
            --output-private-directory "$RUNNER_TEMP/.olt-private/ches-008" \
            --confirm-machine-readable-use-permission --extended --limit 6
