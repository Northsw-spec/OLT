name: OLT fresh foundation (NOT translation certification)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate policy and lexical/link seeds
        run: python scripts/check.py
      - name: Run regression and negative tests
        run: python -m unittest discover -s tests -v
      - name: Assert release is still blocked
        run: |
          if python scripts/check.py --release; then
            echo "ERROR: release gate falsely passed"
            exit 1
          fi
          echo "Expected: Source verification and Genesis release BLOCKED"
