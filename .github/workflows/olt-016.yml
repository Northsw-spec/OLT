name: OLT-016 97-lemma English editorial queue
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_genesis_review_queue.py"
      - "tests/test_olt_016.py"
      - ".github/workflows/olt-016.yml"
  pull_request:
    paths:
      - "scripts/build_genesis_review_queue.py"
      - "tests/test_olt_016.py"
      - ".github/workflows/olt-016.yml"
      - "tests/test_olt_026_ci_wave2.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: olt-016-lexical-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source lemma integrity, owner locks and negative cases
        run: python -m unittest discover -s tests -p 'test_olt_016.py' -v
      - name: Build full Genesis 1 editorial lexical queue
        run: python scripts/build_genesis_review_queue.py
      - name: Validate research status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("data/research/genesis_01_lexeme_editorial_queue.json").read_text())
          assert a["source_lemma_ids"]==97
          assert a["owner_locked_families"]==3
          assert a["new_english_families_pending"]==94
          assert a["publication_status"]=="BLOCKED"
          assert a["approved_homonym_links"]==0
          print("PASS lexical source queue, not editorial approval")
          PY
      - name: Verify committed research data (no direct main writes)
        run: |
          git ls-files --error-unmatch data/research/genesis_01_lexeme_editorial_queue.json >/dev/null
          if ! git diff --exit-code -- data/research/genesis_01_lexeme_editorial_queue.json; then
            echo "::error::Generated data/research/genesis_01_lexeme_editorial_queue.json differs from source. Commit derived files through a pull request."
            exit 1
          fi
          echo "PASS: data/research/genesis_01_lexeme_editorial_queue.json reproducible; publication still BLOCKED"
