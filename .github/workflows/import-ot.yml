name: Import complete Masoretic OT and open Hebrew lexicon
on:
  push:
    branches: [main]
    paths:
      - "scripts/import_ot.py"
      - ".github/workflows/import-ot.yml"
      - "data/imported/**"
  pull_request:
    paths:
      - "scripts/import_ot.py"
      - ".github/workflows/import-ot.yml"
      - "data/imported/**"
      - "tests/test_olt_028_ci_security.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olt-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned OSHB and Hebrew Lexicon revisions
        run: |
          set -euo pipefail
          mkdir -p /tmp/olt-input
          git clone --quiet https://github.com/openscriptures/morphhb.git /tmp/olt-input/morphhb
          git -C /tmp/olt-input/morphhb checkout --quiet 3d15126fb1ef74867fc1434be1942e837932691f
          git clone --quiet https://github.com/openscriptures/HebrewLexicon.git /tmp/olt-input/HebrewLexicon
          git -C /tmp/olt-input/HebrewLexicon checkout --quiet 21c9add13bc727d3a951361778e97e3ff7afd1ce
      - name: Create complete machine-readable Hebrew corpus and lexical source catalog
        run: |
          python scripts/import_ot.py --morph-dir /tmp/olt-input/morphhb/wlc --lexicon-dir /tmp/olt-input/HebrewLexicon --out data/imported
      - name: Validate imported scope, recorded licenses, and noncertification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/imported/manifest.json").read_text())
          assert m["corpus"]["books"] == 39
          assert m["corpus"]["word_tokens"]>200000
          assert m["lexicon"]["strongs"]>8000
          assert m["hard_limits"]["genesis_1_publication"]=="BLOCKED"
          assert m["hard_limits"]["morphology"]=="EXTERNAL_TAGS_IMPORTED_UNREVIEWED"
          assert len(list(Path("data/imported/books").glob("*.json")))==39
          print("PASS: import coverage, not semantic verification")
          PY
      - name: Detect modified or untracked corpus research outputs (read-only)
        run: |
          set -euo pipefail
          git ls-files --error-unmatch data/imported/manifest.json >/dev/null
          if [ -n "$(git status --porcelain --untracked-files=all -- data/imported)" ]; then
            git status --short --untracked-files=all -- data/imported
            echo "::error::Source-derived output differs from committed files. Submit a pull request; CI never pushes to main."
            exit 1
          fi
          echo "PASS: pinned source research reproducible; publication BLOCKED"
