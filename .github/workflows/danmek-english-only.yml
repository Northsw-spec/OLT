name: DANMEK English-only active policy and grammar
on:
  push:
    branches: [main]
    paths:
      - 'scripts/danmek_039_english_only.py'
      - 'tests/test_danmek_039_english_only.py'
      - 'tests/test_danmek_041_dialogue_and_role_guards.py'
      - 'tests/test_danmek_042_closed_adjunct_subjects.py'
      - 'tests/test_danmek_024_owner_comprehensibility_policy.py'
      - 'docs/MASTERPROMPT.md'
      - 'docs/DANMEK_MASTERPROMPT.md'
      - 'docs/STATUS_CURRENT.md'
      - 'data/policy/danmek_024_english_comprehensibility_owner_priority.json'
      - 'data/policy/danmek_039_english_subject_verb_only.json'
      - '.github/workflows/danmek-english-only.yml'
  pull_request:
permissions:
  contents: read
jobs:
  danmek-english-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check sole current English-only contract, no legacy imports and synthetic grammar regression
        run: |
          python -m unittest discover -s tests -p 'test_danmek_039_english_only.py' -v
          python -m unittest discover -s tests -p 'test_danmek_041_dialogue_and_role_guards.py' -v
          python -m unittest discover -s tests -p 'test_danmek_042_closed_adjunct_subjects.py' -v
          python -m unittest discover -s tests -p 'test_danmek_024_owner_comprehensibility_policy.py' -v
      - name: Confirm no licensed CHES source is packaged in this change
        run: |
          test ! -f ches.zip
          test ! -d .olt-private
