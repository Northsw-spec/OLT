name: OLT-013 Genesis 1:21–25 original-source review
on:
  push:
    branches: [main]
    paths:
      - "data/plans/olt_013_genesis_21_25.json"
      - "tests/test_olt_013.py"
      - ".github/workflows/olt-013.yml"
      - "scripts/build_verse_research.py"
      - "data/research/olt_013_genesis_21_25.json"
  pull_request:
    paths:
      - "data/plans/olt_013_genesis_21_25.json"
      - "tests/test_olt_013.py"
      - ".github/workflows/olt-013.yml"
      - "scripts/build_verse_research.py"
      - "tests/test_olt_026_ci_wave2.py"
      - "data/research/olt_013_genesis_21_25.json"
      - "tests/test_olt_029_derived_trigger_coverage.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: olt-013-research
  cancel-in-progress: false
jobs:
  source_review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source-identity, verb-forms and unapproved typology
        run: python -m unittest discover -s tests -p 'test_olt_013.py' -v
      - name: Generate exact source-linked 74-token research
        run: python scripts/build_verse_research.py --plan data/plans/olt_013_genesis_21_25.json --out data/research/olt_013_genesis_21_25.json
      - name: Check the source and explicit unapproved status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/research/olt_013_genesis_21_25.json").read_text())
          assert x["source_token_count"]==74
          assert x["source_wayyiqtol_count"]==9
          assert [len(v["original_word_alignments"]) for v in x["verse_research"]]==[23,13,6,14,18]
          assert x["publication_status"]=="BLOCKED"
          assert not x["full_english_lexicon_approved"]
          assert not x["independent_hebrew_morphology_signed_off"]
          print("PASS source words, not scholarly translation approval")
          PY
      - name: Verify committed research data (no direct main writes)
        run: |
          git ls-files --error-unmatch data/research/olt_013_genesis_21_25.json >/dev/null
          if ! git diff --exit-code -- data/research/olt_013_genesis_21_25.json; then
            echo "::error::Generated data/research/olt_013_genesis_21_25.json differs from source. Commit derived files through a pull request."
            exit 1
          fi
          echo "PASS: data/research/olt_013_genesis_21_25.json reproducible; publication still BLOCKED"
