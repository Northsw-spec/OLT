name: OLT-015 whole Genesis 1 source-word aggregation and research preview
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_full_genesis_research.py"
      - "scripts/research_underwords.py"
      - "data/policy/olt_underword_overrides.json"
      - "tests/test_olt_022_underwords.py"
      - "scripts/research_footnotes.py"
      - "data/research/genesis_01_verse_01_alignment_proposal.json"
      - "tests/test_olt_015.py"
      - "scripts/genesis_literal_proposals.py"
      - ".github/workflows/olt-015.yml"
      - "data/research/genesis_01_complete_research_alignment.json"
      - "genesis/GENESIS_01_SOURCE_RESEARCH_PREVIEW.md"
  pull_request:
    paths:
      - "scripts/audit_full_genesis_research.py"
      - "scripts/research_underwords.py"
      - "data/policy/olt_underword_overrides.json"
      - "tests/test_olt_022_underwords.py"
      - "scripts/research_footnotes.py"
      - "data/research/genesis_01_verse_01_alignment_proposal.json"
      - "tests/test_olt_015.py"
      - "scripts/genesis_literal_proposals.py"
      - ".github/workflows/olt-015.yml"
      - "tests/test_olt_025_workflow_security.py"
      - "data/research/genesis_01_complete_research_alignment.json"
      - "genesis/GENESIS_01_SOURCE_RESEARCH_PREVIEW.md"
      - "tests/test_olt_029_derived_trigger_coverage.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: olt-015-genesis-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test full original-source token IDs and strict negative cases
        run: python -m unittest discover -s tests -p 'test_olt_015.py' -v
      - name: Merge seven independently source-anchored research checkpoints
        run: python scripts/audit_full_genesis_research.py
      - name: Check 434 source tokens, 50 wayyiqtol, 97 lemmas and release block
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/research/genesis_01_complete_research_alignment.json").read_text())
          assert x["source_verses"]==31
          assert x["original_source_word_tokens"]==434
          assert x["source_tagged_wayyiqtol_count"]==50
          assert x["distinct_exact_source_lemma_ids"]==97
          assert x["actual_original_grammar_only_word_tokens"]==7
          assert x["authoritatively_approved_english_verses"]==0
          assert x["publication_status"]=="BLOCKED"
          assert x["actual_homonym_identity_links_approved"]==0
          assert x["underword_links_count"]==1
          assert x["underword_manifest"][0]["source_token_id"]=="01xeN"
          assert x["underword_manifest"][0]["instrumental_claim_confirmed"] is False
          print("PASS original-source coverage; NOT English or literary publication")
          PY
      - name: Verify committed Genesis 1 research artifacts match generated output
        run: |
          git ls-files --error-unmatch \
            data/research/genesis_01_complete_research_alignment.json \
            genesis/GENESIS_01_SOURCE_RESEARCH_PREVIEW.md >/dev/null
          if ! git diff --exit-code -- \
            data/research/genesis_01_complete_research_alignment.json \
            genesis/GENESIS_01_SOURCE_RESEARCH_PREVIEW.md; then
            echo "::error::Generated Genesis 1 research artifacts differ. Regenerate locally and submit a pull request; CI cannot push to main."
            exit 1
          fi
          echo "PASS: Genesis research files are reproducible, source-derived and unapproved for publication"
