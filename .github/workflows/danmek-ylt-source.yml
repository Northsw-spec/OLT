name: DanMek YLT public-domain source pin and verse metadata (no Bible text logs)

on:
  pull_request:
    paths:
      - scripts/danmek_ylt.py
      - scripts/ches_015_direct_private_reader.py
      - tests/test_danmek_002_ylt_verse_authority.py
      - .github/workflows/danmek-ylt-source.yml
  push:
    branches: [main]
    paths:
      - scripts/danmek_ylt.py
      - scripts/ches_015_direct_private_reader.py
      - tests/test_danmek_002_ylt_verse_authority.py
      - .github/workflows/danmek-ylt-source.yml

permissions:
  contents: read

jobs:
  real-public-domain-ylt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare 0700 ephemeral private path
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/.olt-private/ches"
          chmod 0700 "$RUNNER_TEMP/.olt-private" "$RUNNER_TEMP/.olt-private/ches"
      - name: Download and validate pinned public-domain YLT 1898 (no verse text logged)
        env:
          SOURCE_CHES_ROOT: ${{ runner.temp }}/.olt-private/ches
        run: |
          python -m scripts.danmek_ylt \
            --private-root "$SOURCE_CHES_ROOT" \
            --prepare-private-ylt
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.danmek_ylt import load_private_ylt, YLT_GIT_BLOB_SHA1
          doc, digest = load_private_ylt(Path(os.environ["SOURCE_CHES_ROOT"]))
          assert digest == YLT_GIT_BLOB_SHA1
          assert len(doc["books"]) == 66
          ot = [b for b in doc["books"] if b["testament"] == "OT"]
          assert len(ot) == 39
          gen = next(b for b in ot if b["id"] == "gen")
          assert len(gen["chapters"]) == 50
          assert len(gen["chapters"][0]) == 31
          print("YLT public-domain 1898 OT book metadata with 8 chapters:", [
              (b["id"], b.get("name", ""))
              for b in ot if len(b["chapters"]) == 8
          ])
          from scripts.danmek_ylt import YLT_BOOK_ID_BY_SOURCE_PREFIX
          for original, ylt_id, chapter_count in (
              ("qoh", "ecc", 12),
              ("can", "sng", 8),
              ("eze", "ezk", 48),
              ("joe", "jol", 3),
              ("nah", "nam", 3),
              ("1kg", "1ki", 22),
              ("2kg", "2ki", 25),
          ):
              assert YLT_BOOK_ID_BY_SOURCE_PREFIX[original] == ylt_id
              target = next((b for b in ot if b["id"] == ylt_id), None)
              assert target is not None, "MISSING_YLT_BOOK_ID_" + ylt_id
              assert len(target["chapters"]) == chapter_count
          # Book identifiers and names are public metadata, not Bible text.
          known_ids = {b["id"] for b in ot}
          unknown_targets = sorted(
              {target for target in YLT_BOOK_ID_BY_SOURCE_PREFIX.values()
               if target not in known_ids}
          )
          print("YLT historic OT book metadata:", [
              (b["id"], b.get("name", "")) for b in ot
          ])
          assert not unknown_targets, "UNRECOGNIZED_YLT_BOOK_IDS_" + repr(unknown_targets)
          # An actual YLT-1898 edition check: this English version includes
          # Neh 7:68 (horses/mules) and 7:69 (camels). The CHES original
          # PDF has 72 primary markers 1..67, 69..73; never forge 7:68.
          from scripts.danmek_ylt import ylt_verse_for_source
          nehemiah = next(b for b in ot if b["id"] == "neh")
          assert len(nehemiah["chapters"][6]) == 73
          assert ylt_verse_for_source(
              doc, prefix="neh", chapter=7, verse=67
          ) is not None
          assert ylt_verse_for_source(
              doc, prefix="neh", chapter=7, verse=68
          ) is None
          assert ylt_verse_for_source(
              doc, prefix="neh", chapter=7, verse=69,
              original_pdf_alternate_verse=68
          ) is not None
          assert ylt_verse_for_source(
              doc, prefix="neh", chapter=7, verse=69,
              original_pdf_alternate_verse=69
          ) is None
          assert ylt_verse_for_source(
              doc, prefix="neh", chapter=7, verse=73,
              original_pdf_alternate_verse=72
          ) is not None
          print("Pinned YLT Nehemiah 7 has 73 verses with expected 68/69 control words; no text emitted")
          print("Verified pinned YLT 1898: 39 OT, 27 NT; all configured book IDs valid; no verse text emitted")
          PY
      - name: Run synthetic-only YLT noun/tense regression suite
        run: python -m unittest discover -s tests -p 'test_danmek_002_ylt_verse_authority.py' -v
      - name: Destroy public-domain reference after CI verification
        if: always()
        run: rm -rf "$RUNNER_TEMP/.olt-private"
