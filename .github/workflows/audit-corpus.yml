name: Source-level corpus and Genesis 1 morphology audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_corpus.py"
      - "scripts/build_lexicon_candidates.py"
      - "tests/test_lexicon_candidates.py"
      - "tests/test_corpus_audit.py"
      - ".github/workflows/audit-corpus.yml"
      - "data/quality/corpus_audit.json"
      - "data/quality/observed_exact_lemmas.json"
      - "data/quality/genesis_01_morphology.json"
      - "data/quality/lexicon_candidates.jsonl"
      - "data/quality/genesis_01_owner_lock_anchors.json"
      - "data/quality/lexicon_join_report.json"
  pull_request:
    paths:
      - "scripts/audit_corpus.py"
      - "scripts/build_lexicon_candidates.py"
      - "tests/test_lexicon_candidates.py"
      - "tests/test_corpus_audit.py"
      - ".github/workflows/audit-corpus.yml"
      - "data/quality/corpus_audit.json"
      - "data/quality/observed_exact_lemmas.json"
      - "data/quality/genesis_01_morphology.json"
      - "data/quality/lexicon_candidates.jsonl"
      - "data/quality/genesis_01_owner_lock_anchors.json"
      - "data/quality/lexicon_join_report.json"
      - "tests/test_olt_028_ci_security.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olt-corpus-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Morphology parser regression tests
        run: python -m unittest discover -s tests -p 'test_corpus_audit.py' -v
      - name: Candidate lexicon ID parser tests
        run: python -m unittest discover -s tests -p 'test_lexicon_candidates.py' -v
      - name: Audit ALL imported OT words and build Genesis 1 source tag ledger
        run: python scripts/audit_corpus.py
      - name: Build ALL lemma candidates from fresh audit and actual Genesis keys
        run: python scripts/build_lexicon_candidates.py
      - name: Verify source-derived report and no fake release status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/quality")
          a=json.loads((p/"corpus_audit.json").read_text())
          assert a["token_count"]==306785
          assert a["verse_count"]==23213
          assert a["distinct_exact_lemma_keys"]>=8640
          assert a["genesis_1_verse_count"]==31
          assert a["genesis_1_source_tokens"]>400
          assert a["genesis_1_wayyiqtol_source_tag_count"]==50, a["genesis_1_wayyiqtol_source_tag_count"]
          assert a["editorial_certification"]=="NOT_PERFORMED"
          c=json.loads((p/"lexicon_join_report.json").read_text())
          assert c["observed_source_lemma_keys"]==a["distinct_exact_lemma_keys"]
          assert c["genesis_1_owner_lock_candidates"]["asah"]==7
          assert c["genesis_1_owner_lock_candidates"]["bara"]==5
          assert c["genesis_1_owner_lock_candidates"]["raqia"]==9
          assert c["all_english_approval"]=="NOT_DONE"
          z=json.loads((p/"genesis_01_morphology.json").read_text())
          assert z["status"]=="IMPORTED_SOURCE_MORPHOLOGY_NOT_INDEPENDENTLY_REVIEWED"
          print("SOURCE TAG AUDIT PASS, NOT MANUAL PHILOLOGICAL SIGNOFF")
          PY
      - name: Detect modified or untracked corpus research outputs (read-only)
        run: |
          set -euo pipefail
          git ls-files --error-unmatch data/quality/corpus_audit.json data/quality/observed_exact_lemmas.json data/quality/genesis_01_morphology.json data/quality/lexicon_candidates.jsonl data/quality/genesis_01_owner_lock_anchors.json data/quality/lexicon_join_report.json >/dev/null
          if [ -n "$(git status --porcelain --untracked-files=all -- data/quality)" ]; then
            git status --short --untracked-files=all -- data/quality
            echo "::error::Source-derived output differs from committed files. Submit a pull request; CI never pushes to main."
            exit 1
          fi
          echo "PASS: pinned source research reproducible; publication BLOCKED"
